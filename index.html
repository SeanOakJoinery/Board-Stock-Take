<!--
  ============================================================================
  CLAUDE DEV NOTES — read this before changing anything
  ============================================================================
  What this is: single-file board/timber stock app for a workshop. Root user
  manages other users (name + PIN) and picks which tabs each user can use.
  Data (boards, users, activity log, settings) lives in one Firebase Realtime
  Database node, shared by everyone who opens this page, synced live (no
  polling needed — Firebase pushes changes to every open tab/phone). Reorder
  emails go out through EmailJS when a board's stock drops to/below its
  reorder level.

  This app uses its OWN Firebase project — separate from the stock take app
  and the dispatch note app, which share a different Firebase project
  ("Oak-Joinery-Stock-Dispatch").

  ROOT SETUP (do this once, before publishing to GitHub Pages):
    1. Fill in the CONFIG block below (Firebase config + EmailJS ids).
    2. In the Firebase console, set the Realtime Database rules to allow
       read/write (see SETUP.md) — this app authenticates with a PIN inside
       its own UI, not with Firebase Auth, so the database itself is left
       open the same way the old jsonbin key was.
    3. Push to GitHub Pages. Open the published link.
    4. The app will show a one-time "Set up your workshop" screen — that
       creates the Root user and seeds the default board list into the
       database.
  Because the Firebase config / EmailJS ids live only in this file's source
  (not in the in-app Settings screen), day-to-day users never see them and
  can't change them from inside the app.

  DATA SHAPE (the one JSON object stored at DB_PATH in the database):
  {
    meta: { companyName, reorderEmail, appUrl, setupDone },
    locations: ["Main", ...],  // root-managed fixed list — see LOCATIONS below
    boards: [{ code, description, category, unit, qty: {locationName: number, ...}, reorderLevel, reorderNotified }],
    log: [{ id, ts, user, boardCode, action, qtyChange, resultingQty, reason }]
  }
  users[] no longer lives here — see SHARED AUTH further down for why
  (shared with the Dispatch/Stock List/Consumables apps).

  SEND TO DISPATCH (added 2026-09-22, per user request: "i want a
  section off sending from...board stock to dispatch"): new tab, gated
  by boardSendToDispatch. Deducts a board's stock at a chosen location
  and writes a new Unfinished item directly into the Dispatch app's own
  'dispatchBoard/items' (same shared Firebase project — see dev notes
  top of file), carrying recipeSnapshot:[{sourceApp:'boardStock',
  itemId:code, desc, deductQty, location}] so it's reversible from
  Dispatch with "Return to stock" (see that app's returnItemToStock,
  which was generalized the same day to handle boardStock/
  consumablesStock sources alongside its original stockList one).

  LOCATIONS (added 2026-09-21, per user request: "mark where the boards
  are sitting like kramaville santon or boksburg... a kramaville section
  and a boksburg section or wherever else i need it to be"): board.qty
  changed from a single number to an object keyed by location name.
  data.locations is root-managed (Settings tab) — addLocation()/
  removeLocation(). migrateLegacyQty() (called from every place data
  gets loaded — fetchRemote/startRealtimeSync/boot's cache path)
  converts any board still using the OLD plain-number qty into the
  object shape the first time it's seen, crediting the old number to
  data.locations[0] — nothing is lost on upgrade. totalQty(board) sums
  across all locations (used for reorder checks and the boards-admin
  list); qtyAt(board, location) reads one location's amount (used on
  the Stock tab's per-location sections and in Add/Remove stock).

  Known limits (be upfront with the client about these if asked):
  - The database rules are open (".read"/".write": true) since there's no
    Firebase Auth — anyone with the Firebase config values (visible in this
    file's source) can read/write the data directly, same trust model as the
    old jsonbin master key.
  - EmailJS free tier has a monthly send cap; fine for reorder alerts.

  Update this comment block whenever you change how the app works.
  ============================================================================
-->

<style>
  :root{
    --bg: #1E1C18;
    --panel: #26221C;
    --panel-2: #2E2A22;
    --border: #433D32;
    --border-soft: #362F27;
    --text: #EFE8D8;
    --text-muted: #9C9280;
    --amber: #E3A23A;
    --amber-dim: #EEB055;
    --amber-bg: rgba(227,162,58,0.14);
    --green: #5FA776;
    --green-bg: rgba(95,167,118,0.14);
    --red: #C1613D;
    --red-bg: rgba(193,97,61,0.16);
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(227,162,58,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.brand,.tile-name,.big-num{font-family:'Space Grotesk',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{min-height:100%; display:flex; flex-direction:column;}

  /* ---------- generic ---------- */
  button{font-family:inherit; cursor:pointer;}
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--panel-2);
    color:var(--text); padding:12px 18px; border-radius:var(--radius);
    font-size:15px; font-weight:600; min-height:48px; transition:background .15s, border-color .15s;
  }
  .btn:hover{border-color:var(--amber-dim);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber); border-color:var(--amber); color:#241a08;}
  .btn-primary:hover{background:var(--amber-dim);}
  .btn-danger{background:var(--red); border-color:var(--red); color:#fff0ea;}
  .btn-ghost{background:transparent; border-color:var(--border);}
  .btn-block{width:100%;}
  .btn-sm{min-height:38px; padding:8px 14px; font-size:13px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  label{display:block; font-size:13px; color:var(--text-muted); margin:14px 0 6px;}
  input[type=text], input[type=number], input[type=email], input[type=password], input[type=tel], select, textarea{
    width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:var(--radius); font-size:16px; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  .field-row{display:flex; gap:12px;}
  .field-row > div{flex:1;}
  .helptext{font-size:12px; color:var(--text-muted); margin-top:6px;}

  .card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px;}
  .stack{display:flex; flex-direction:column; gap:14px;}

  .badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;}
  .badge-ok{background:var(--green-bg); color:var(--green);}
  .badge-reorder{background:var(--red-bg); color:#e17e5b;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot-ok{background:var(--green);}
  .dot-reorder{background:var(--red);}

  .center-screen{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-box{width:100%; max-width:420px;}

  /* ---------- topbar / tabbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:5; background:rgba(23,21,19,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border-soft); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{font-size:18px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:10px;}
  .brand-mark{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--amber),var(--amber-dim)); display:flex; align-items:center; justify-content:center; font-size:15px; color:#241a08; font-weight:800;}
  .brand-wordmark{font-size:13px; font-weight:600; letter-spacing:.12em; line-height:1.25; text-align:right; color:var(--text);}
  .brand-wordmark span{display:block; font-weight:400; font-size:9px; letter-spacing:.2em; color:var(--amber);}
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .who{font-size:13px; color:var(--text-muted); text-align:right; line-height:1.3;}
  .who b{color:var(--text);}

  main{flex:1; padding:18px; padding-bottom:96px; max-width:1000px; width:100%; margin:0 auto;}

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:6;
    background:rgba(23,21,19,0.96); backdrop-filter:blur(8px); border-top:1px solid var(--border-soft);
    display:flex; justify-content:center; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar-inner{display:flex; gap:2px; max-width:1000px; width:100%; overflow-x:auto;}
  .tab-btn{
    flex:1; min-width:64px; background:none; border:none; color:var(--text-muted);
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; border-radius:10px; font-size:11px; font-weight:600;
  }
  .tab-btn.active{color:var(--amber); background:var(--amber-bg);}
  .tab-icon{font-size:19px; line-height:1;}

  /* ---------- login ---------- */
  .user-tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; margin-top:18px;}
  .tile{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
    padding:20px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--text);
  }
  .tile:hover{border-color:var(--amber-dim);}
  .tile-avatar{width:48px; height:48px; border-radius:50%; background:var(--amber-bg); color:var(--amber); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;}
  .tile-name{font-size:14px; font-weight:600;}
  .tile-role{font-size:11px; color:var(--text-muted);}

  /* ---------- board grid ---------- */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input[type=text]{flex:1; min-width:180px;}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
  .stat{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px;}
  .stat .n{font-size:26px; font-weight:700;}
  .stat .l{font-size:12px; color:var(--text-muted);}

  .board-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .location-section{margin-bottom:20px;}
  .location-section summary{cursor:pointer; font-size:16px; font-weight:700; padding:10px 0; border-bottom:1px solid var(--border); margin-bottom:12px; list-style:none;}
  .location-section summary::-webkit-details-marker{display:none;}
  .location-section summary::before{content:"▸ "; color:var(--amber);}
  .location-section[open] summary::before{content:"▾ "; color:var(--amber);}
  .board-card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:8px; position:relative;}
  .board-card.reorder{border-color:var(--red);}
  .board-code{font-size:12px; color:var(--amber); letter-spacing:.4px;}
  .board-desc{font-size:14px; font-weight:600; line-height:1.3;}
  .board-meta{font-size:12px; color:var(--text-muted);}
  .board-bottom{display:flex; align-items:flex-end; justify-content:space-between; margin-top:auto;}
  .big-num{font-size:30px; font-weight:700;}
  .unit-tag{font-size:11px; color:var(--text-muted);}
  .edit-link{position:absolute; top:12px; right:12px; font-size:11px; color:var(--text-muted); background:none; border:none; text-decoration:underline;}

  /* ---------- log table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--border-soft);}
  th{color:var(--text-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .qty-plus{color:var(--green); font-weight:700;}
  .qty-minus{color:#e17e5b; font-weight:700;}

  .user-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border:1px solid var(--border-soft); border-radius:var(--radius); margin-bottom:10px;}
  .perm-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px;}
  .perm-check{display:flex; align-items:center; gap:8px; font-size:13px; background:var(--panel); border:1px solid var(--border-soft); padding:10px 12px; border-radius:8px;}
  .perm-check input{width:16px; height:16px;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); z-index:20;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
    max-width:90vw; text-align:center;
  }
  .toast.error{border-color:var(--red); color:#f2b7a3;}
  .toast.ok{border-color:var(--green); color:#c9e5b8;}

  .banner{background:var(--red-bg); border:1px solid var(--red); color:#f2b7a3; padding:10px 14px; border-radius:var(--radius); font-size:13px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:10px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:30; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:18px 18px 0 0; width:100%; max-width:480px; padding:20px; max-height:88vh; overflow-y:auto;}
  @media (min-width:600px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:16px;}
  }
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .modal-head h3{margin:0;}
  .close-x{background:none; border:none; color:var(--text-muted); font-size:22px; line-height:1;}

  .empty{color:var(--text-muted); font-size:13px; text-align:center; padding:30px 10px;}
  .divider{height:1px; background:var(--border-soft); margin:16px 0;}
  .small-muted{font-size:12px; color:var(--text-muted);}
  .kv{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border-soft);}
</style>
</head>

<script>

  code, description, category, unit, qty, reorderLevel: 5, reorderNotified: false
}));

// Namespaced ("board...") per user request to share the SAME users[] /
// permissions object as the Dispatch and Stock List apps (one shared
// roster, one Manage Users screen) — unprefixed keys here would clash
// with similarly-named permissions in those apps. manageUsers is the
// one exception: it's the same concept (can edit the shared roster)
// everywhere, so it's intentionally NOT namespaced.
const PERMISSIONS = [
  { key:"boardAddBoard",   label:"Add Boards",     icon:"➕" },
  { key:"boardAddQty",     label:"Add Stock",      icon:"📥" },
  { key:"boardRemoveQty",  label:"Remove Stock",   icon:"📤" },
  { key:"boardSendToDispatch", label:"Send to Dispatch", icon:"🚚" },
  { key:"boardExportData", label:"Export stock report", icon:"📄" },
  { key:"boardViewLog",    label:"Activity Log",   icon:"📋" },
  { key:"manageUsers",     label:"Manage Users",   icon:"👤" },
  { key:"boardSettings",   label:"App Settings",   icon:"⚙️" },
];
function blankPermissions(val){
  const p = {}; PERMISSIONS.forEach(x => p[x.key] = val); return p;
}

const CACHE_KEY = "boardstock_cache_v1";
const CONFIG_OK = CONFIG.FIREBASE_CONFIG
                 && CONFIG.FIREBASE_CONFIG.apiKey && !CONFIG.FIREBASE_CONFIG.apiKey.startsWith("PASTE_")
                 && CONFIG.FIREBASE_CONFIG.databaseURL && !CONFIG.FIREBASE_CONFIG.databaseURL.startsWith("PASTE_");
// Email sending moved server-side (weekly digest via GitHub Actions,
// see dev notes) — this app no longer talks to EmailJS directly at all.

let fb = null, fbRef = null, dispatchBoardRef = null;
if (CONFIG_OK && window.firebase) {
  try {
    fb = firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
    fbRef = firebase.database().ref(CONFIG.DB_PATH);
    // Shared with the Dispatch/Stock List apps — this is where the
    // one common users[] roster lives (see SHARED AUTH below). This
    // app never writes the whole 'dispatchBoard' node, only the
    // 'users' child, so it can never clobber the dispatch board's
    // own items/notes/etc.
    dispatchBoardRef = firebase.database().ref("dispatchBoard");
  } catch(e){ console.warn("Firebase init failed:", e); }
}

/* ============================================================================
   SHARED AUTH — same users[]/permissions system as the Dispatch and Stock
   List apps (per user request: "use the same api and bin as the other
   apps and the same app permissions"). Login/user-management lives on
   the shared 'dispatchBoard/users' path; this app's OWN data (boards,
   log, meta) stays at CONFIG.DB_PATH, untouched by any of this.
   ============================================================================ */
const APP_ID = "boardStock";
const APP_LABELS = { dispatch: "Dispatch app", stock: "Stock List app", boardStock: "Board Stock app", consumables: "Consumables app" };
function defaultApps(){ return { dispatch: true, stock: true, boardStock: true, consumables: true }; }
function getMainRoot(){ return state.sharedUsers.find(u => u.isMainRoot) || state.sharedUsers.find(u => u.isRoot) || null; }
function isMainRoot(u){ const mr = getMainRoot(); return !!(u && mr && u.id === mr.id); }
function currentUserIsMainRoot(){ return isMainRoot(state.currentUser); }
function userHasApp(u, appId){
  appId = appId || APP_ID;
  if (!u) return false;
  if (isMainRoot(u)) return true;
  if (!u.apps) return true; // legacy account — not yet scoped
  return !!u.apps[appId];
}
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
// Writes state.sharedUsers straight to dispatchBoard/users ONLY — a
// partial-path write, never the whole dispatchBoard node.
async function saveSharedUsers(){
  if (!dispatchBoardRef) return;
  try { await dispatchBoardRef.child("users").set(state.sharedUsers); } catch(e){ console.warn("Could not save users:", e); }
}
function startSharedUsersSync(){
  if (!dispatchBoardRef) return;
  dispatchBoardRef.child("users").on("value", (snap) => {
    state.sharedUsers = Array.isArray(snap.val()) ? snap.val() : [];
    render();
  });
}

/* ============================================================================
   STATE
   ============================================================================ */
let state = {
  data: null,            // the full synced object (this app's OWN data: meta/boards/log)
  loaded: false,
  syncError: null,
  sharedUsers: [],       // synced live from dispatchBoard/users — shared with Dispatch/Stock List
  currentUser: null,     // an entry from sharedUsers: {id,username,pin,isRoot,isMainRoot,apps,permissions}
  loginStep: "pick",     // 'pick' | 'pin'
  loginUserId: null,
  loginError: "",
  tab: "stock",
  boardSearch: "",
  busy: false,
};

function loadCache(){
  try { const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveCache(data){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
}

/* ============================================================================
   FIREBASE SYNC
   Realtime Database pushes changes to every open tab/phone automatically —
   no polling needed. fetchRemote() below is still used as a one-shot read
   right before saving (in mutate()), so two people editing at once still
   layer their changes onto the freshest copy rather than the listener's
   last snapshot, which could be a beat behind.
   ============================================================================ */
async function fetchRemote(){
  if (!fbRef) throw new Error("Not connected to Firebase.");
  const snapshot = await fbRef.once("value");
  const val = snapshot.val();
  if (!val) return null;
  // Firebase drops empty arrays/objects, so make sure the shape stays intact.
  // NOTE: users no longer lives here — see SHARED AUTH / sharedUsers.
  return migrateLegacyQty({ meta: val.meta || {}, boards: val.boards || [], log: val.log || [], locations: val.locations || [], suppliers: val.suppliers || {} });
}
async function saveRemote(data){
  if (!fbRef) throw new Error("Not connected to Firebase.");
  await fbRef.set(data);
}

function emptyData(){
  return { meta: { companyName:"", reorderEmail:"", appUrl:"", setupDone:false }, boards: [], log: [], locations: ["Main"], suppliers: {} };
}

// --- LOCATIONS (added 2026-09-21, per user request: "mark where the
// boards are sitting like kramaville santon or boksburg... a kramaville
// section and a boksburg section or wherever else i need it to be") ---
// board.qty changed from a single number to an object keyed by location
// name: { "Kramerville": 20, "Boksburg": 15 }. data.locations is the
// root-managed fixed list (per user request — not free-text per board).
// migrateLegacyQty() below converts any board still using the OLD plain-
// number qty (from before this change) into the object shape the first
// time it's seen, crediting the old number to the first location in the
// list — nothing is lost on upgrade.
function totalQty(board){
  if(typeof board.qty === 'number') return board.qty; // not yet migrated
  return Object.values(board.qty || {}).reduce((a,b)=>a+(Number(b)||0), 0);
}
function qtyAt(board, location){
  if(typeof board.qty === 'number') return location === (state.data.locations||["Main"])[0] ? board.qty : 0;
  return (board.qty && board.qty[location]) || 0;
}
function migrateLegacyQty(data){
  if(!data.locations || data.locations.length === 0) data.locations = ["Main"];
  const firstLoc = data.locations[0];
  (data.boards||[]).forEach(b => {
    if(typeof b.qty === 'number'){
      b.qty = { [firstLoc]: b.qty };
    }
  });
  return data;
}

function boot(){
  startSharedUsersSync();
  const cached = loadCache();
  if (cached) { state.data = migrateLegacyQty(cached); state.loaded = true; render(); }

  if (!CONFIG_OK){
    state.syncError = "This app isn't connected to a stock database yet — the Firebase details in the file's CONFIG block still need to be filled in.";
    if (!state.data) state.data = emptyData();
    state.loaded = true;
    render();
    return;
  }

  // Fallback in case Firebase never responds (e.g. blocked network) — makes
  // sure the screen doesn't hang on "Loading…" forever.
  const timeout = setTimeout(() => {
    if (!state.loaded){
      state.syncError = "Couldn't reach the stock database — check your connection and reload.";
      if (!state.data) state.data = emptyData();
      state.loaded = true;
      render();
    }
  }, 8000);

  startRealtimeSync(timeout);
}

function startRealtimeSync(bootTimeout){
  fbRef.on("value", (snapshot) => {
    if (bootTimeout) { clearTimeout(bootTimeout); bootTimeout = null; }
    const val = snapshot.val();
    const remote = val ? migrateLegacyQty({ meta: val.meta || {}, boards: val.boards || [], log: val.log || [], locations: val.locations || [], suppliers: val.suppliers || {} }) : null;
    if (remote && remote.meta && remote.meta.setupDone !== undefined) {
      state.data = remote;
      saveCache(state.data);
    } else if (!state.data){
      state.data = emptyData();
    }
    state.syncError = null;
    state.loaded = true;
    render();
  }, (error) => {
    if (bootTimeout) { clearTimeout(bootTimeout); bootTimeout = null; }
    state.syncError = state.data ? "Working from the last saved copy — couldn't reach the stock database just now." : (error.message || "Couldn't reach the stock database.");
    if (!state.data) state.data = emptyData();
    state.loaded = true;
    render();
  });
}

// Read-modify-write helper: always fetches the freshest copy right before
// applying a change, to reduce two people's edits clobbering each other.
async function mutate(mutatorFn, successMsg){
  state.busy = true; render();
  try {
    let fresh = state.data;
    if (CONFIG_OK) {
      try { fresh = await fetchRemote(); if (!fresh || !fresh.meta) fresh = state.data; } catch(e){ /* fall back to local */ }
    }
    const result = mutatorFn(fresh) || fresh;
    state.data = result;
    saveCache(state.data);
    if (CONFIG_OK) await saveRemote(state.data);
    state.busy = false;
    if (successMsg) toast(successMsg, "ok");
    render();
    return true;
  } catch(e){
    state.busy = false;
    toast(e.message || "Something went wrong saving that.", "error");
    render();
    return false;
  }
}

/* ============================================================================
   REORDER TRACKING
   ============================================================================ */
// Per user request, this no longer sends an email itself the instant
// something crosses its reorder level — that's now handled by a
// separate weekly scheduled digest (see the GitHub Actions workflow +
// weekly-reorder-report.js), which reads this same Firebase data
// directly and sends one email per supplier every Monday morning.
// reorderNotified is kept only as harmless historical bookkeeping —
// nothing reads it anymore.
async function checkReorder(data, board){
  const low = totalQty(board) <= board.reorderLevel;
  if (low && !board.reorderNotified){
    board.reorderNotified = true;
  } else if (!low && board.reorderNotified){
    board.reorderNotified = false;
  }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});

function initials(name){ return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function toast(msg, kind){

}

function render(){

  // not this app's own data — so an empty roster here means genuinely
  // nobody has ever set up ANY of the four apps yet, not just this one.

async function submitLogin(){
  const pin = document.getElementById("login-pin").value;
  const user = state.sharedUsers.find(u => u.id === state.loginUserId);
  const enteredHash = await hashPin(pin);
  if (!user || enteredHash !== user.pin){
    state.loginError = "Incorrect PIN — try again.";
    render();
    setTimeout(()=>document.getElementById("login-pin")?.focus(), 50);
    return;
  }
  state.currentUser = user;
  state.loginStep = "pick";
  state.tab = "stock";
  render();
}

/* ---------------- STOCK REPORT PDF (added 2026-09-23, per user request:
   "is it setup to pull stock levels...on a stock report to hand in to
   my superiors" — mirrors Stock List's own Print/Share PDF exactly). ---------------- */
function buildStockPdfBlob(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const locations = state.data.locations && state.data.locations.length ? state.data.locations : ["Main"];

  doc.setFontSize(14);
  doc.setFont(undefined, "bold");
  doc.text(state.data.meta.companyName || "Board Stock", 14, 18);
  doc.setFontSize(16);
  doc.setFont(undefined, "bold");
  doc.text("Board Stock Report", 14, 30);
  doc.setFontSize(9);
  doc.setFont(undefined, "normal");
  doc.text("Generated " + new Date().toLocaleString(), 14, 36);

  const boards = [...state.data.boards].sort((a,b)=>a.code.localeCompare(b.code));
  const rows = boards.map(b => {
    const total = totalQty(b);
    const breakdown = locations.map(l => `${l}: ${qtyAt(b,l)}`).join("  ·  ");
    return [b.code, b.description, b.category || "—", breakdown, `${total} ${b.unit}`, `${b.reorderLevel} ${b.unit}`];
  });
  doc.autoTable({
    startY: 44,
    head: [["Code", "Description", "Category", "By location", "Total on hand", "Reorder at"]],
    body: rows,
    styles: { fontSize: 8, cellPadding: 2 },
    headStyles: { fillColor: [184, 121, 31] },
    margin: { left: 14, right: 14 },
  });

  return doc.output("blob");
}
async function generateAndSharePdf(){
  if(!can("boardExportData")) return;
  const btn = document.getElementById("share-pdf-btn");
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Preparing PDF…";
  try{
    const blob = buildStockPdfBlob();
    const file = new File([blob], "board-stock-report.pdf", { type: "application/pdf" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: "Board Stock Report", text: "Board stock report — " + new Date().toLocaleDateString() });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "board-stock-report.pdf";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  } catch(e){
    if(e.name !== "AbortError") toast("Could not generate the PDF.", "error");
  }
  btn.disabled = false;
  btn.textContent = original;
}

/* ---------------- SEND TO DISPATCH (added 2026-09-22, per user request:
   "i want a section off sending from...board stock to dispatch"). Mirrors
   the Stock List app's own send-to-dispatch/mark-built feature: deducts
   from a chosen board's stock at a chosen location, and creates a real
   Unfinished item directly in the Dispatch app's board data (shared
   Firebase project, 'dispatchBoard/items') carrying a recipeSnapshot so
   it's reversible from Dispatch with "Return to stock" (see that app's
   returnItemToStock — recipeSnapshot.sourceApp:'boardStock' is how it
   knows to credit a board rather than a Stock List item). ---------------- */
function renderSendToDispatch(){
  const boards = [...state.data.boards].sort((a,b)=>a.code.localeCompare(b.code));
  const locations = state.data.locations && state.data.locations.length ? state.data.locations : ["Main"];
  return `
    <div class="card">
      <h2 style="margin-top:0;">Send to Dispatch</h2>
      <p class="small-muted">Deducts stock here and creates a matching item in the Dispatch app's Unfinished column. Can be undone from there with "Return to stock".</p>
      <label>Location</label>
      <select id="sd-loc">${locations.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join("")}</select>
      <label>Board</label>
      <select id="sd-board">${boards.map(b=>`<option value="${esc(b.code)}">${esc(b.code)} — ${esc(b.description)} (total on hand: ${totalQty(b)} ${esc(b.unit)})</option>`).join("")}</select>
      <label>Quantity</label>
      <input type="number" id="sd-qty" min="1" step="1" value="1">
      <label>Reference / job</label>
      <input type="text" id="sd-ref" placeholder="e.g. NH Hotel">
      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="submitSendToDispatch()" ${state.busy?"disabled":""}>${state.busy?"Sending…":"Send to Dispatch"}</button>
    </div>`;
}
async function submitSendToDispatch(){
  if(!can("boardSendToDispatch")) return;
  const code = document.getElementById("sd-board").value;
  const location = document.getElementById("sd-loc").value;
  const qty = parseInt(document.getElementById("sd-qty").value, 10);
  const ref = document.getElementById("sd-ref").value.trim();
  if (!code || !qty || qty <= 0){ toast("Enter a valid quantity.", "error"); return; }
  if (!dispatchBoardRef){ toast("Not connected to the Dispatch app yet — try again in a moment.", "error"); return; }
  const who = state.currentUser.username;

  const board = findBoard(state.data, code);
  if (!board){ toast("That board no longer exists.", "error"); return; }
  const here = board.qty[location] || 0;
  if (qty > here && !confirm(`Only ${here} ${board.unit} on hand at ${location} — send anyway? Stock will show as negative there.`)) return;

  state.busy = true; render();
  try{
    // Deduct here first...
    const ok = await mutate((data) => {
      const b = findBoard(data, code);
      if (!b) throw new Error("That board no longer exists — refresh and try again.");
      if(typeof b.qty !== 'object') b.qty = {};
      b.qty[location] = (b.qty[location] || 0) - qty;
      checkReorder(data, b);
      data.log.unshift({ id: uid(), ts: new Date().toISOString(), user: who, boardCode: code, action: "sentToDispatch", qtyChange: -qty, resultingQty: totalQty(b), reason: `Sent to dispatch${ref ? ' — ' + ref : ''} (${location})` });
      return data;
    }, null);
    if(!ok){ state.busy = false; render(); return; }

    // ...then create the matching item directly in Dispatch's own data.
    const snap = await dispatchBoardRef.child("items").once("value");
    const items = Array.isArray(snap.val()) ? snap.val() : [];
    const today = new Date().toLocaleDateString("en-GB", {day:"2-digit", month:"long", year:"numeric"});
    items.push({
      id: uid(), type: board.description, qty, ref,
      status: "unvinaged",
      addedDate: today, vinagedDate: null, readyDate: null, dispatchedDate: null, noteId: null,
      recipeSnapshot: [{ sourceApp: "boardStock", itemId: code, desc: board.description, deductQty: qty, location }]
    });
    await dispatchBoardRef.child("items").set(items);
    toast(`Sent ${qty} ${board.unit} of ${code} to Dispatch.`, "ok");
    document.getElementById("sd-qty").value = "1";
    document.getElementById("sd-ref").value = "";
  } catch(e){
    toast("Could not reach the Dispatch app — check your connection and try again.", "err");
  }
  state.busy = false; render();
}

    const board = findBoard(data, code);
    if (!board) throw new Error("Board not found.");
    board.description = desc; board.category = cat; board.unit = unit; board.reorderLevel = reorderLevel; board.supplierId = supplierId;
    checkReorder(data, board);
    return data;
  }, `${code} updated.`);
  if (ok) closeModal();
}

/* ---------------- LOG ---------------- */
function renderLog(){
  const entries = state.data.log.slice(0, 200);
  return `
    <div class="card">
      <h2 style="margin-top:0;">Activity log</h2>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>When</th><th>Board</th><th>User</th><th>Change</th><th>Balance</th><th>Reason</th></tr></thead>
        <tbody>
          ${entries.map(e => `
            <tr>
              <td class="small-muted">${fmtDate(e.ts)}</td>
              <td class="mono">${esc(e.boardCode)}</td>
              <td>${esc(e.user)}</td>
              <td class="${e.qtyChange>0?'qty-plus':e.qtyChange<0?'qty-minus':''}">${e.qtyChange>0?'+':''}${e.qtyChange}</td>
              <td>${e.resultingQty}</td>
              <td class="small-muted">${esc(e.reason||'')}</td>

}

// Cutting Log (added 2026-09-23, per user request: "on the stock list
// what is in stock and on a separate log what was cut and the notes
// with it") — the Stock tab stays purely current on-hand levels; this
// is a dedicated view of just the "remove" log entries, since that's

    <div class="card">
      <h2 style="margin-top:0;">Cutting log</h2>
      <p class="small-muted">Every time board stock was removed/used, in one place — separate from the full Activity Log.</p>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>When</th><th>Board</th><th>User</th><th>Qty used</th><th>Reason</th><th>Notes</th></tr></thead>
        <tbody>

            <tr>
              <td class="small-muted">${fmtDate(e.ts)}</td>

/* ---------------- USERS (shared roster — same accounts as Dispatch/Stock List) ---------------- */
function renderUsers(){
  const users = state.sharedUsers;
  const iAmMainRoot = currentUserIsMainRoot();
  return `
    <div class="card" style="margin-bottom:18px;">
      <h2 style="margin-top:0;">Add a team member</h2>
      <div class="field-row">
        <div><label>Username</label><input type="text" id="nu-name" placeholder="e.g. Thabo"></div>
        <div><label>PIN (at least 4 characters)</label><input type="password" id="nu-pin" placeholder="••••"></div>
      </div>
      <label>Which apps can they use?${iAmMainRoot ? '' : ' (main root only)'}</label>
      <div class="perm-grid" style="${iAmMainRoot ? '' : 'opacity:.5;'}">
        ${Object.keys(APP_LABELS).map(a => `<label class="perm-check"><input type="checkbox" class="nu-app" data-app="${a}" ${iAmMainRoot ? '' : 'disabled'}> ${APP_LABELS[a]}</label>`).join("")}
      </div>
      <label style="margin-top:10px;">What can they do in ${esc(CONFIG.APP_TITLE)}?</label>
      <div class="perm-grid">
        ${PERMISSIONS.map(p => `<label class="perm-check"><input type="checkbox" id="nu-perm-${p.key}"> ${p.icon} ${p.label}</label>`).join("")}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="submitNewUser()" ${state.busy?"disabled":""}>${state.busy?"Saving…":"Add user"}</button>
    </div>
    <h3>Team</h3>
    <div class="stack">
      ${users.map(u => `
        <div class="user-row">
          <div>
            <div style="font-weight:600;">${esc(u.username)} ${isMainRoot(u)?'<span class="badge badge-ok">Main root</span>':(u.isRoot?'<span class="badge badge-ok">Root</span>':'')}</div>
            <div class="small-muted">${isMainRoot(u) ? 'All apps' : Object.keys(APP_LABELS).filter(a=>userHasApp(u,a)).map(a=>APP_LABELS[a]).join(", ") || 'No apps'}</div>
            <div class="small-muted">${u.isRoot ? 'Full access' : PERMISSIONS.filter(p=>u.permissions && u.permissions[p.key]).map(p=>p.label).join(", ") || 'No permissions set in this app'}</div>
          </div>
          ${(isMainRoot(u) && !iAmMainRoot) ? `<span class="small-muted">Can't be edited</span>` : `<button class="btn btn-ghost btn-sm" onclick="openEditUser('${u.id}')">Edit</button>`}
        </div>`).join("")}
    </div>`;
}
async function submitNewUser(){
  const username = document.getElementById("nu-name").value.trim();
  const pin = document.getElementById("nu-pin").value;
  if (!username || pin.length < 4){ toast("Username and a PIN of at least 4 characters are required.", "error"); return; }
  const permissions = {}; PERMISSIONS.forEach(p => permissions[p.key] = document.getElementById(`nu-perm-${p.key}`).checked);
  const apps = currentUserIsMainRoot()
    ? Object.fromEntries([...document.querySelectorAll(".nu-app")].map(cb => [cb.dataset.app, cb.checked]))
    : defaultApps();
  state.sharedUsers.push({ id: uid(), username, pin: await hashPin(pin), isRoot: false, permissions, apps });
  await saveSharedUsers();
  toast(`${username} added.`);
  render();
}
function openEditUser(id){
  const u = state.sharedUsers.find(x=>x.id===id);
  if (!u) return;
  if (isMainRoot(u) && !currentUserIsMainRoot()){ toast("Only the main root account can edit itself.", "error"); return; }
  const iAmMainRoot = currentUserIsMainRoot();
  const apps = u.apps || defaultApps();
  openModal(`
    <div class="modal-head"><h3>Edit ${esc(u.username)}</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <label>Username</label><input type="text" id="eu-name" value="${esc(u.username)}">
    <label>PIN</label><input type="password" id="eu-pin" placeholder="Leave blank to keep current PIN">
    <label style="margin-top:10px;">Which apps can they use?${iAmMainRoot ? '' : ' (main root only)'}</label>
    <div class="perm-grid" style="${iAmMainRoot ? '' : 'opacity:.5;'}">
      ${Object.keys(APP_LABELS).map(a => `<label class="perm-check"><input type="checkbox" class="eu-app" data-app="${a}" ${apps[a]?'checked':''} ${iAmMainRoot ? '' : 'disabled'}> ${APP_LABELS[a]}</label>`).join("")}
    </div>
    <label style="margin-top:10px;">What can they do in ${esc(CONFIG.APP_TITLE)}?</label>
    <div class="perm-grid">
      ${PERMISSIONS.map(p => `<label class="perm-check"><input type="checkbox" id="eu-perm-${p.key}" ${u.permissions && u.permissions[p.key]?'checked':''}> ${p.icon} ${p.label}</label>`).join("")}
    </div>
    ${!isMainRoot(u) ? `<label class="perm-check" style="margin-top:12px;"><input type="checkbox" id="eu-root" ${u.isRoot?'checked':''}> Full access (root — can do everything in their apps)</label>` : ''}
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-primary" style="flex:1;" onclick="submitEditUser('${id}')">Save changes</button>
      ${isMainRoot(u) ? '' : `<button class="btn btn-danger" onclick="deleteUser('${id}')">Remove</button>`}
    </div>
  `);
}
async function submitEditUser(id){
  const u = state.sharedUsers.find(x=>x.id===id);
  if (!u) return;
  if (isMainRoot(u) && !currentUserIsMainRoot()) return; // belt and braces
  const username = document.getElementById("eu-name").value.trim();
  const pin = document.getElementById("eu-pin").value;
  if (!username){ toast("Username is required.", "error"); return; }
  const permissions = {}; PERMISSIONS.forEach(p => permissions[p.key] = document.getElementById(`eu-perm-${p.key}`).checked);
  const rootBox = document.getElementById("eu-root");
  // App access is main-root-only — for anyone else the checkboxes are
  // disabled, so their state is ignored and the existing value carries
  // through untouched, same reasoning as the Dispatch/Stock List apps.
  const apps = currentUserIsMainRoot()
    ? Object.fromEntries([...document.querySelectorAll(".eu-app")].map(cb => [cb.dataset.app, cb.checked]))
    : (u.apps || defaultApps());
  u.username = username;
  if (pin) u.pin = await hashPin(pin);
  u.permissions = permissions;
  u.isRoot = isMainRoot(u) ? true : (rootBox ? rootBox.checked : u.isRoot);
  u.apps = isMainRoot(u) ? defaultApps() : apps;
  await saveSharedUsers();
  toast("User updated.");
  closeModal();
  render();
}
async function deleteUser(id){
  const target = state.sharedUsers.find(x=>x.id===id);
  if (!target) return;
  if (isMainRoot(target)){ toast("You can't delete the main root account.", "error"); return; }
  if (target.isRoot && state.sharedUsers.filter(u=>u.isRoot).length <= 1){ toast("You can't delete the only root account — make another user root first.", "error"); return; }
  if (id === (state.currentUser && state.currentUser.id)){ toast("You can't delete the account you're logged in as.", "error"); return; }
  if (!confirm("Remove this user? They'll no longer be able to log in to any app.")) return;
  state.sharedUsers = state.sharedUsers.filter(x=>x.id!==id);
  await saveSharedUsers();
  toast("User removed.");
  closeModal();
  render();
}

/* ---------------- SETTINGS (root) ---------------- */
function renderSettings(){
  const m = state.data.meta;
  const link = m.appUrl || window.location.href;
  const locations = state.data.locations && state.data.locations.length ? state.data.locations : ["Main"];
  return `
    <div class="card" style="margin-bottom:18px;">
      <h2 style="margin-top:0;">Locations</h2>
      <p class="small-muted">Where board stock is physically kept — each shows as its own section on the Stock tab.</p>
      <div class="stack">
        ${locations.map((l,i) => `
          <div class="user-row">
            <div style="font-weight:600;">${esc(l)}</div>
            ${locations.length > 1 ? `<button class="btn btn-ghost btn-sm" onclick="removeLocation(${i})">Remove</button>` : `<span class="small-muted">Can't remove the last one</span>`}
          </div>`).join("")}
      </div>
      <div class="field-row" style="margin-top:14px;">
        <div style="flex:1;"><input type="text" id="nl-name" placeholder="e.g. Sandton"></div>
        <button class="btn btn-primary" onclick="addLocation()">Add location</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:18px;">
      <h2 style="margin-top:0;">Workshop settings</h2>
      <label>Company / workshop name</label>
      <input type="text" id="st-company" value="${esc(m.companyName)}">
      <label>Reorder alert email</label>
      <input type="email" id="st-email" value="${esc(m.reorderEmail)}">
      <div class="helptext">This address receives one automatic email per supplier every Monday morning, listing whatever's below its reorder level.</div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="submitSettings()" ${state.busy?"disabled":""}>${state.busy?"Saving…":"Save settings"}</button>
    </div>
    <div class="card">
      <h2 style="margin-top:0;">Share the app</h2>
      <p class="small-muted">Send this link to your team so they can log in on their own phones.</p>
      <input type="text" id="st-link" value="${esc(link)}" readonly onclick="this.select()">
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn btn-primary" style="flex:1;" onclick="shareLink('${esc(link)}')">Share link</button>
        <button class="btn btn-ghost" onclick="copyLink('${esc(link)}')">Copy</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="small-muted">Connection: ${CONFIG_OK ? "Connected to stock database ✅" : "Not connected ⚠️"}</div>
  `;
}
async function addLocation(){
  const input = document.getElementById("nl-name");
  const name = input.value.trim();
  if(!name){ toast("Enter a location name.", "error"); return; }
  const ok = await mutate((data) => {
    if(!data.locations) data.locations = ["Main"];
    if(data.locations.some(l => l.toLowerCase() === name.toLowerCase())) throw new Error("That location already exists.");
    data.locations.push(name);
    return data;
  }, `${name} added.`);
  if(ok) input.value = "";
}
async function removeLocation(index){
  const locations = state.data.locations || ["Main"];
  const name = locations[index];
  if(locations.length <= 1){ toast("You need at least one location.", "error"); return; }
  const boardsHere = state.data.boards.filter(b => qtyAt(b, name) > 0);
  if(boardsHere.length > 0 && !confirm(`${boardsHere.length} board type(s) still have stock recorded at "${name}". Remove this location anyway? That stock will no longer be shown anywhere — move it first if you don't want to lose track of it.`)) return;
  const ok = await mutate((data) => {
    data.locations = (data.locations || ["Main"]).filter((l,i) => i !== index);
    return data;
  }, `${name} removed.`);
}
async function submitSettings(){
  const companyName = document.getElementById("st-company").value.trim();
  const reorderEmail = document.getElementById("st-email").value.trim();
  await mutate((data) => { data.meta.companyName = companyName; data.meta.reorderEmail = reorderEmail; return data; }, "Settings saved.");
}
async function shareLink(link){
  if (navigator.share){
    try { await navigator.share({ title: state.data.meta.companyName || "Board Stock", text: "Log in to check board stock:", url: link }); return; } catch(e){ /* user cancelled or unsupported, fall through */ }
  }
  copyLink(link);
}
function copyLink(link){
  navigator.clipboard?.writeText(link).then(()=>toast("Link copied — paste it into WhatsApp, email, etc.", "ok"))
    .catch(()=>toast("Couldn't copy automatically — select and copy the link above.", "error"));
}
