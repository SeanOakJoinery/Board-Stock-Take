<!--
  ============================================================================
  CLAUDE DEV NOTES — read this before changing anything
  ============================================================================
  What this is: single-file board/timber stock app for a workshop. Root user
  manages other users (name + PIN) and picks which tabs each user can use.
  Data (boards, users, activity log, settings) lives in one Firebase Realtime
  Database node, shared by everyone who opens this page, synced live (no
  polling needed — Firebase pushes changes to every open tab/phone). Reorder
  emails go out through EmailJS when a board's stock drops to/below its
  reorder level.

  This app uses its OWN Firebase project — separate from the stock take app
  and the dispatch note app, which share a different Firebase project
  ("Oak-Joinery-Stock-Dispatch").

  ROOT SETUP (do this once, before publishing to GitHub Pages):
    1. Fill in the CONFIG block below (Firebase config + EmailJS ids).
    2. In the Firebase console, set the Realtime Database rules to allow
       read/write (see SETUP.md) — this app authenticates with a PIN inside
       its own UI, not with Firebase Auth, so the database itself is left
       open the same way the old jsonbin key was.
    3. Push to GitHub Pages. Open the published link.
    4. The app will show a one-time "Set up your workshop" screen — that
       creates the Root user and seeds the default board list into the
       database.
  Because the Firebase config / EmailJS ids live only in this file's source
  (not in the in-app Settings screen), day-to-day users never see them and
  can't change them from inside the app.

  DATA SHAPE (the one JSON object stored at DB_PATH in the database):
  {
    meta: { companyName, reorderEmail, appUrl, setupDone },
    boards: [{ code, description, category, unit, qty, reorderLevel, reorderNotified }],
    users: [{ id, name, pin, role: 'root'|'user', active, permissions:{addBoard,addQty,removeQty,viewLog,manageUsers,settings} }],
    log: [{ id, ts, user, boardCode, action, qtyChange, resultingQty, reason }]
  }

  Known limits (be upfront with the client about these if asked):
  - PINs are stored as plain text in the database. Fine for an internal
    workshop tool behind a private link, not meant for anything more
    sensitive.
  - The database rules are open (".read"/".write": true) since there's no
    Firebase Auth — anyone with the Firebase config values (visible in this
    file's source) can read/write the data directly, same trust model as the
    old jsonbin master key.
  - EmailJS free tier has a monthly send cap; fine for reorder alerts.

  Update this comment block whenever you change how the app works.
  ============================================================================
-->

const CACHE_KEY = "boardstock_cache_v1";
const CONFIG_OK = CONFIG.FIREBASE_CONFIG

                 && CONFIG.FIREBASE_CONFIG.databaseURL && !CONFIG.FIREBASE_CONFIG.databaseURL.startsWith("PASTE_");

if (EMAIL_OK && window.emailjs) { emailjs.init({ publicKey: CONFIG.EMAILJS_PUBLIC_KEY }); }

let fb = null, fbRef = null;
if (CONFIG_OK && window.firebase) {
  try {
    fb = firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
    fbRef = firebase.database().ref(CONFIG.DB_PATH);

}

/* ============================================================================
   STATE
   ============================================================================ */
let state = {
  data: null,            // the full synced object
  loaded: false,
  syncError: null,
  currentUser: null,     // {id,name,role,permissions}
  loginStep: "pick",     // 'pick' | 'pin'
  loginUserId: null,
  loginError: "",
  tab: "stock",
  boardSearch: "",
  busy: false,
};

function loadCache(){
  try { const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveCache(data){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
}

/* ============================================================================
   FIREBASE SYNC
   Realtime Database pushes changes to every open tab/phone automatically —
   no polling needed. fetchRemote() below is still used as a one-shot read
   right before saving (in mutate()), so two people editing at once still
   layer their changes onto the freshest copy rather than the listener's
   last snapshot, which could be a beat behind.
   ============================================================================ */
async function fetchRemote(){
  if (!fbRef) throw new Error("Not connected to Firebase.");
  const snapshot = await fbRef.once("value");
  const val = snapshot.val();
  if (!val) return null;
  // Firebase drops empty arrays/objects, so make sure the shape stays intact.
  return { meta: val.meta || {}, boards: val.boards || [], users: val.users || [], log: val.log || [] };
}
async function saveRemote(data){
  if (!fbRef) throw new Error("Not connected to Firebase.");
  await fbRef.set(data);
}

function emptyData(){
  return { meta: { companyName:"", reorderEmail:"", appUrl:"", setupDone:false }, boards: [], users: [], log: [] };
}

function boot(){
  const cached = loadCache();
  if (cached) { state.data = cached; state.loaded = true; render(); }

  if (!CONFIG_OK){
    state.syncError = "This app isn't connected to a stock database yet — the Firebase details in the file's CONFIG block still need to be filled in.";
    if (!state.data) state.data = emptyData();
    state.loaded = true;
    render();
    return;
  }

  // Fallback in case Firebase never responds (e.g. blocked network) — makes
  // sure the screen doesn't hang on "Loading…" forever.
  const timeout = setTimeout(() => {
    if (!state.loaded){
      state.syncError = "Couldn't reach the stock database — check your connection and reload.";
      if (!state.data) state.data = emptyData();
      state.loaded = true;
      render();
    }
  }, 8000);

  startRealtimeSync(timeout);
}

function startRealtimeSync(bootTimeout){
  fbRef.on("value", (snapshot) => {
    if (bootTimeout) { clearTimeout(bootTimeout); bootTimeout = null; }
    const val = snapshot.val();
    const remote = val ? { meta: val.meta || {}, boards: val.boards || [], users: val.users || [], log: val.log || [] } : null;
    if (remote && remote.meta && remote.meta.setupDone !== undefined) {
      state.data = remote;
      saveCache(state.data);
    } else if (!state.data){
      state.data = emptyData();
    }
    state.syncError = null;
    state.loaded = true;
    render();
  }, (error) => {
    if (bootTimeout) { clearTimeout(bootTimeout); bootTimeout = null; }
    state.syncError = state.data ? "Working from the last saved copy — couldn't reach the stock database just now." : (error.message || "Couldn't reach the stock database.");
    if (!state.data) state.data = emptyData();
    state.loaded = true;
    render();
  });
}

// Read-modify-write helper: always fetches the freshest copy right before
// applying a change, to reduce two people's edits clobbering each other.
async function mutate(mutatorFn, successMsg){
  state.busy = true; render();
  try {
    let fresh = state.data;
    if (CONFIG_OK) {
      try { fresh = await fetchRemote(); if (!fresh || !fresh.meta) fresh = state.data; } catch(e){ /* fall back to local */ }
    }
    const result = mutatorFn(fresh) || fresh;
    state.data = result;
    saveCache(state.data);
    if (CONFIG_OK) await saveRemote(state.data);
    state.busy = false;
    if (successMsg) toast(successMsg, "ok");
    render();
    return true;
  } catch(e){
    state.busy = false;
    toast(e.message || "Something went wrong saving that.", "error");
    render();
    return false;
  }
}

/* ============================================================================
   REORDER EMAIL
   ============================================================================ */
async function checkReorder(data, board){
  const low = board.qty <= board.reorderLevel;
  if (low && !board.reorderNotified){
    board.reorderNotified = true;
    sendReorderEmail(data, board); // fire and forget — don't block the save
  } else if (!low && board.reorderNotified){
    board.reorderNotified = false;
  }
}
function sendReorderEmail(data, board){
  if (!EMAIL_OK || !window.emailjs){ return; }
  const to = data.meta.reorderEmail;
  if (!to){ return; }
  emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
    to_email: to,
    company_name: data.meta.companyName || "Workshop",
    board_code: board.code,
    board_description: board.description,
    board_category: board.category || "",
    board_unit: board.unit,
    current_qty: String(board.qty),
    reorder_level: String(board.reorderLevel),
  }).catch(err => console.warn("Reorder email failed:", err));
}

/* ============================================================================
   SMALL HELPERS
   ============================================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"}) + " " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function initials(name){ return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function toast(msg, kind){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function activeUsers(data){ return data.users.filter(u => u.active !== false); }
function findBoard(data, code){ return data.boards.find(b => b.code === code); }
function can(perm){ return state.currentUser && (state.currentUser.role === "root" || state.currentUser.permissions[perm]); }

function openModal(html){
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

/* ============================================================================
   RENDER — top level dispatcher
   ============================================================================ */
function render(){
  const app = document.getElementById("app");
  if (!state.loaded){ app.innerHTML = `<div class="center-screen"><div class="small-muted">Loading…</div></div>`; return; }

  if (CONFIG_OK && (!state.data.meta || !state.data.meta.setupDone)){

async function submitAddQty(){
  const code = document.getElementById("aq-board").value;
  const qty = parseInt(document.getElementById("aq-qty").value, 10);
  const note = document.getElementById("aq-note").value.trim();
  if (!code || !qty || qty <= 0){ toast("Enter a valid quantity.", "error"); return; }
  const who = state.currentUser.name;
  const ok = await mutate((data) => {
    const board = findBoard(data, code);
    if (!board) throw new Error("That board no longer exists — refresh and try again.");
    board.qty += qty;
    checkReorder(data, board);
    data.log.unshift({ id: uid(), ts: new Date().toISOString(), user: who, boardCode: code, action: "add", qtyChange: qty, resultingQty: board.qty, reason: note || "Stock received" });
    return data;
  }, `Added ${qty} to ${code}.`);
  if (ok){ document.getElementById("aq-qty").value = ""; document.getElementById("aq-note").value = ""; }
}

async function submitRemoveQty(){
  const code = document.getElementById("rq-board").value;
  const qty = parseInt(document.getElementById("rq-qty").value, 10);
  let reason = document.getElementById("rq-reason").value;
  if (reason === "Other"){ reason = document.getElementById("rq-other").value.trim(); }
  if (!code || !qty || qty <= 0){ toast("Enter a valid quantity.", "error"); return; }
  if (!reason){ toast("A reason is required to remove stock.", "error"); return; }
  const who = state.currentUser.name;
  const ok = await mutate((data) => {
    const board = findBoard(data, code);
    if (!board) throw new Error("That board no longer exists — refresh and try again.");
    if (qty > board.qty){
      if (!confirm(`Only ${board.qty} ${board.unit} on hand — remove anyway? Stock will show as negative.`)) throw new Error("Cancelled — nothing was removed.");
    }
    board.qty -= qty;
    checkReorder(data, board);
    data.log.unshift({ id: uid(), ts: new Date().toISOString(), user: who, boardCode: code, action: "remove", qtyChange: -qty, resultingQty: board.qty, reason });
    return data;
  }, `Removed ${qty} from ${code}.`);
  if (ok){ document.getElementById("rq-qty").value = ""; const o = document.getElementById("rq-other"); if(o) o.value = ""; }
}

async function submitNewBoard(){

            <tr>
              <td class="small-muted">${fmtDate(e.ts)}</td>
              <td class="mono">${esc(e.boardCode)}</td>
              <td>${esc(e.user)}</td>
              <td class="${e.qtyChange>0?'qty-plus':e.qtyChange<0?'qty-minus':''}">${e.qtyChange>0?'+':''}${e.qtyChange}</td>
              <td>${e.resultingQty}</td>
              <td class="small-muted">${esc(e.reason||'')}</td>
            </tr>`).join("") || `<tr><td colspan="6" class="empty">No activity yet.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>`;
}

/* ---------------- USERS (root management) ---------------- */
function renderUsers(){
  const users = state.data.users;
  return `
    <div class="card" style="margin-bottom:18px;">
      <h2 style="margin-top:0;">Add a team member</h2>
      <div class="field-row">
        <div><label>Name</label><input type="text" id="nu-name" placeholder="e.g. Thabo"></div>
        <div><label>PIN (4–6 digits)</label><input type="password" inputmode="numeric" id="nu-pin" maxlength="6" placeholder="••••"></div>
      </div>
      <label>What can they do?</label>
      <div class="perm-grid">
        ${PERMISSIONS.map(p => `<label class="perm-check"><input type="checkbox" id="nu-perm-${p.key}"> ${p.icon} ${p.label}</label>`).join("")}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="submitNewUser()" ${state.busy?"disabled":""}>${state.busy?"Saving…":"Add user"}</button>
    </div>
    <h3>Team</h3>
    <div class="stack">
      ${users.map(u => `
        <div class="user-row">
          <div>
            <div style="font-weight:600;">${esc(u.name)} ${u.role==='root'?'<span class="badge badge-ok">Root</span>':''}${u.active===false?'<span class="badge badge-reorder">Inactive</span>':''}</div>
            <div class="small-muted">${u.role==='root' ? 'Full access' : PERMISSIONS.filter(p=>u.permissions[p.key]).map(p=>p.label).join(", ") || 'No permissions set'}</div>
          </div>
          ${u.role==='root' ? `<span class="small-muted">Can't be edited</span>` : `<button class="btn btn-ghost btn-sm" onclick="openEditUser('${u.id}')">Edit</button>`}
        </div>`).join("")}
    </div>`;
}
async function submitNewUser(){
  const name = document.getElementById("nu-name").value.trim();
  const pin = document.getElementById("nu-pin").value.trim();
  if (!name || !/^[0-9]{4,6}$/.test(pin)){ toast("Name and a 4–6 digit PIN are required.", "error"); return; }
  const permissions = {}; PERMISSIONS.forEach(p => permissions[p.key] = document.getElementById(`nu-perm-${p.key}`).checked);
  const ok = await mutate((data) => {
    if (data.users.some(u => u.pin === pin)) throw new Error("That PIN is already in use — choose a different one.");
    data.users.push({ id: uid(), name, pin, role:"user", active:true, permissions });
    return data;
  }, `${name} added.`);
  if (ok){ document.getElementById("nu-name").value=""; document.getElementById("nu-pin").value=""; PERMISSIONS.forEach(p=>document.getElementById(`nu-perm-${p.key}`).checked=false); }
}
function openEditUser(id){
  const u = state.data.users.find(x=>x.id===id);
  if (!u) return;
  openModal(`
    <div class="modal-head"><h3>Edit ${esc(u.name)}</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <label>Name</label><input type="text" id="eu-name" value="${esc(u.name)}">
    <label>PIN</label><input type="password" inputmode="numeric" id="eu-pin" maxlength="6" value="${esc(u.pin)}">
    <label>What can they do?</label>
    <div class="perm-grid">
      ${PERMISSIONS.map(p => `<label class="perm-check"><input type="checkbox" id="eu-perm-${p.key}" ${u.permissions[p.key]?'checked':''}> ${p.icon} ${p.label}</label>`).join("")}
    </div>
    <label class="perm-check" style="margin-top:12px;"><input type="checkbox" id="eu-active" ${u.active!==false?'checked':''}> Active (unchecking hides them from the login screen)</label>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-primary" style="flex:1;" onclick="submitEditUser('${id}')">Save changes</button>
      <button class="btn btn-danger" onclick="deleteUser('${id}')">Remove</button>
    </div>
  `);
}
async function submitEditUser(id){
  const name = document.getElementById("eu-name").value.trim();
  const pin = document.getElementById("eu-pin").value.trim();
  const active = document.getElementById("eu-active").checked;
  if (!name || !/^[0-9]{4,6}$/.test(pin)){ toast("Name and a 4–6 digit PIN are required.", "error"); return; }
  const permissions = {}; PERMISSIONS.forEach(p => permissions[p.key] = document.getElementById(`eu-perm-${p.key}`).checked);
  const ok = await mutate((data) => {
    const user = data.users.find(x=>x.id===id);
    if (!user) throw new Error("User not found.");
    if (data.users.some(x=>x.id!==id && x.pin===pin)) throw new Error("That PIN is already in use.");
    user.name=name; user.pin=pin; user.permissions=permissions; user.active=active;
    return data;
  }, "User updated.");
  if (ok) closeModal();
}
async function deleteUser(id){
  if (!confirm("Remove this user? They'll no longer be able to log in.")) return;
  const ok = await mutate((data) => { data.users = data.users.filter(x=>x.id!==id); return data; }, "User removed.");
  if (ok) closeModal();
}

/* ---------------- SETTINGS (root) ---------------- */
function renderSettings(){
  const m = state.data.meta;
  const link = m.appUrl || window.location.href;
  return `
    <div class="card" style="margin-bottom:18px;">
      <h2 style="margin-top:0;">Workshop settings</h2>
      <label>Company / workshop name</label>
      <input type="text" id="st-company" value="${esc(m.companyName)}">
      <label>Reorder alert email</label>
      <input type="email" id="st-email" value="${esc(m.reorderEmail)}">
      <div class="helptext">${EMAIL_OK ? "Email sending is connected." : "⚠️ Email sending isn't connected yet — the EmailJS details in the app's CONFIG block still need to be filled in."}</div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="submitSettings()" ${state.busy?"disabled":""}>${state.busy?"Saving…":"Save settings"}</button>
    </div>
    <div class="card">
      <h2 style="margin-top:0;">Share the app</h2>
      <p class="small-muted">Send this link to your team so they can log in on their own phones.</p>
      <input type="text" id="st-link" value="${esc(link)}" readonly onclick="this.select()">
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="btn btn-primary" style="flex:1;" onclick="shareLink('${esc(link)}')">Share link</button>
        <button class="btn btn-ghost" onclick="copyLink('${esc(link)}')">Copy</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="small-muted">Connection: ${CONFIG_OK ? "Connected to stock database ✅" : "Not connected ⚠️"} · ${EMAIL_OK ? "Email connected ✅" : "Email not connected ⚠️"}</div>
  `;
}
async function submitSettings(){
  const companyName = document.getElementById("st-company").value.trim();
  const reorderEmail = document.getElementById("st-email").value.trim();
  await mutate((data) => { data.meta.companyName = companyName; data.meta.reorderEmail = reorderEmail; return data; }, "Settings saved.");
}
async function shareLink(link){
  if (navigator.share){
    try { await navigator.share({ title: state.data.meta.companyName || "Board Stock", text: "Log in to check board stock:", url: link }); return; } catch(e){ /* user cancelled or unsupported, fall through */ }
  }
  copyLink(link);
}
function copyLink(link){
  navigator.clipboard?.writeText(link).then(()=>toast("Link copied — paste it into WhatsApp, email, etc.", "ok"))
    .catch(()=>toast("Couldn't copy automatically — select and copy the link above.", "error"));
}

/* ============================================================================
   GO
   ============================================================================ */
boot();
</script>
</body>
</html>
