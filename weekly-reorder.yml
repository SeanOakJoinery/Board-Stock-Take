name: Weekly reorder digest

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC = 07:00 South Africa time
  workflow_dispatch: {}   # adds a "Run workflow" button for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send weekly reorder digest
        run: node weekly-reorder-report.js
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
