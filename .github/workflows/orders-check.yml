name: Orders check (overdue deliveries)

on:
  schedule:
    - cron: "0 5 * * 1-5"   # weekdays 05:00 UTC = 07:00 SA: full list Mon & Wed, other days only when a promised delivery date has just passed
  workflow_dispatch: {}     # adds a "Run workflow" button for testing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Email orders still outstanding after a week
        run: node orders-check.js
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
